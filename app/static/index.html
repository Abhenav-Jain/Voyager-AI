<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoyagerAI - Personalized Travel Itinerary Planner</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
    .badge-chip { transition: all 0.2s ease-in-out; }
    .badge-chip:hover { transform: translateY(-1px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased flex flex-col">
  <div id="root"></div>

  <!-- React Application Script -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [view, setView] = useState("builder"); // "builder", "itinerary", "saved", "scenarios"
      const [loading, setLoading] = useState(false);
      const [loadingMessage, setLoadingMessage] = useState("");
      const [health, setHealth] = useState(null);
      const [itinerary, setItinerary] = useState(null);
      const [savedTrips, setSavedTrips] = useState([]);
      const [activeDayTab, setActiveDayTab] = useState("all");
      const [regenModalOpen, setRegenModalOpen] = useState(false);
      const [targetRegenDay, setTargetRegenDay] = useState(1);
      const [regenFeedback, setRegenFeedback] = useState("More relaxed pace with hidden local gems");

      // Wizard Form State
      const [formData, setFormData] = useState({
        destination: "Tokyo, Japan",
        start_date: "2026-11-10",
        end_date: "2026-11-12",
        traveler_type: "solo",
        group_size: 1,
        budget_level: "moderate",
        target_budget_usd: 500,
        interests: ["food", "sightseeing", "culture"],
        pacing: "balanced",
        special_requests: ""
      });

      useEffect(() => {
        fetchHealth();
        fetchSavedTrips();
      }, []);

      const fetchHealth = async () => {
        try {
          const res = await fetch("/api/auth/health");
          if (res.ok) {
            const data = await res.json();
            setHealth(data);
          }
        } catch (e) {
          console.warn("Health check error", e);
        }
      };

      const fetchSavedTrips = async () => {
        try {
          const res = await fetch("/api/trips");
          if (res.ok) {
            const data = await res.json();
            setSavedTrips(data);
          }
        } catch (e) {
          console.warn("Failed to load saved trips", e);
        }
      };

      const handleInterestToggle = (interest) => {
        setFormData(prev => {
          const exists = prev.interests.includes(interest);
          return {
            ...prev,
            interests: exists 
              ? prev.interests.filter(i => i !== interest)
              : [...prev.interests, interest]
          };
        });
      };

      const handleGenerate = async (e) => {
        if (e) e.preventDefault();
        setLoading(true);
        setLoadingMessage("Synthesizing itinerary with AI Prompt Engineering & Transformer Ranking...");
        try {
          const res = await fetch("/api/trips/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData)
          });
          if (res.ok) {
            const data = await res.json();
            setItinerary(data);
            setActiveDayTab("all");
            setView("itinerary");
            fetchSavedTrips();
          } else {
            alert("Generation failed. Please check inputs.");
          }
        } catch (err) {
          alert("Error connecting to backend: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      const loadScenario = async (scenarioNumber) => {
        setLoading(true);
        setLoadingMessage(`Loading Scenario ${scenarioNumber} with AI-optimized constraints...`);
        try {
          const res = await fetch(`/api/scenarios/scenario-${scenarioNumber}`);
          if (res.ok) {
            const data = await res.json();
            setItinerary(data);
            setActiveDayTab("all");
            setView("itinerary");
            fetchSavedTrips();
          }
        } catch (err) {
          alert("Error loading scenario: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleRegenerateDay = async () => {
        if (!itinerary) return;
        setLoading(true);
        setLoadingMessage(`Regenerating Day ${targetRegenDay} with your preferences...`);
        try {
          const res = await fetch(`/api/trips/${itinerary.id}/regenerate-day`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              day_number: targetRegenDay,
              feedback: regenFeedback
            })
          });
          if (res.ok) {
            const updated = await res.json();
            setItinerary(updated);
            setRegenModalOpen(false);
          }
        } catch (err) {
          alert("Regeneration failed: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleReplaceActivity = async (dayNumber, activityId) => {
        if (!itinerary) return;
        setLoading(true);
        setLoadingMessage("Swapping activity with tailored alternative...");
        try {
          const res = await fetch(`/api/trips/${itinerary.id}/replace-activity`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              day_number: dayNumber,
              activity_id: activityId,
              preference: "Alternative scenic or cultural option"
            })
          });
          if (res.ok) {
            const updated = await res.json();
            setItinerary(updated);
          }
        } catch (err) {
          alert("Replace failed: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleExport = (format) => {
        if (!itinerary) return;
        window.open(`/api/trips/${itinerary.id}/export?format=${format}`, "_blank");
      };

      const loadSavedTrip = async (id) => {
        setLoading(true);
        try {
          const res = await fetch(`/api/trips/${id}`);
          if (res.ok) {
            const data = await res.json();
            setItinerary(data);
            setActiveDayTab("all");
            setView("itinerary");
          }
        } finally {
          setLoading(false);
        }
      };

      const availableInterests = [
        "food", "sightseeing", "culture", "outdoors", "relaxation", "scenic", "adventure", "nightlife", "photography"
      ];

      return (
        <div className="flex-1 flex flex-col">
          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setView("builder")}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-600 to-emerald-400 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-teal-500/20">
                  ✦
                </div>
                <div>
                  <h1 className="font-bold text-lg tracking-tight text-slate-900 leading-none">VoyagerAI</h1>
                  <span className="text-xs text-slate-500 font-medium">Personalized Travel Itinerary Planner</span>
                </div>
              </div>

              {/* Navigation */}
              <nav className="hidden md:flex items-center space-x-1">
                <button
                  onClick={() => setView("builder")}
                  className={`px-3 py-2 rounded-lg text-sm font-semibold transition ${view === "builder" ? "bg-teal-50 text-teal-700" : "text-slate-600 hover:text-slate-900"}`}
                >
                  Trip Builder
                </button>
                <button
                  onClick={() => setView("scenarios")}
                  className={`px-3 py-2 rounded-lg text-sm font-semibold transition ${view === "scenarios" ? "bg-teal-50 text-teal-700" : "text-slate-600 hover:text-slate-900"}`}
                >
                  Scenarios (1-3)
                </button>
                {itinerary && (
                  <button
                    onClick={() => setView("itinerary")}
                    className={`px-3 py-2 rounded-lg text-sm font-semibold transition ${view === "itinerary" ? "bg-teal-50 text-teal-700" : "text-slate-600 hover:text-slate-900"}`}
                  >
                    Active Plan
                  </button>
                )}
                <button
                  onClick={() => { setView("saved"); fetchSavedTrips(); }}
                  className={`px-3 py-2 rounded-lg text-sm font-semibold transition ${view === "saved" ? "bg-teal-50 text-teal-700" : "text-slate-600 hover:text-slate-900"}`}
                >
                  Saved Trips ({savedTrips.length})
                </button>
                <a
                  href="/docs"
                  target="_blank"
                  className="px-3 py-2 text-sm font-semibold text-slate-500 hover:text-slate-900"
                >
                  API Docs ↗
                </a>
              </nav>

              {/* Status pill */}
              <div className="flex items-center space-x-2 text-xs">
                <span className="inline-flex items-center px-2.5 py-1 rounded-full font-medium bg-emerald-100 text-emerald-800">
                  <span className="w-1.5 h-1.5 mr-1.5 rounded-full bg-emerald-600 animate-pulse"></span>
                  AI Engine Ready ({health?.transformer_engine?.device || "CPU"})
                </span>
              </div>
            </div>
          </header>

          {/* Main Container */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
            
            {/* Loading Overlay */}
            {loading && (
              <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl text-center space-y-4">
                  <div className="w-12 h-12 border-4 border-teal-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
                  <h3 className="font-bold text-lg text-slate-900">Personalizing Your Journey</h3>
                  <p className="text-sm text-slate-600">{loadingMessage}</p>
                </div>
              </div>
            )}

            {/* SCENARIOS VIEW */}
            {view === "scenarios" && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-2xl font-extrabold text-slate-900">Pre-Built Project Scenarios</h2>
                  <p className="text-sm text-slate-600 mt-1">Test the 3 real-world scenarios outlined in the technical specification.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {/* Scenario 1 */}
                  <div className="glass-card p-6 rounded-2xl flex flex-col justify-between hover:shadow-lg transition border border-teal-100">
                    <div>
                      <div className="flex items-center justify-between mb-3">
                        <span className="px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-sky-100 text-sky-800">Scenario 1</span>
                        <span className="text-xs font-semibold text-slate-500">2-Day Weekend</span>
                      </div>
                      <h3 className="font-bold text-lg text-slate-900">Solo Traveler Weekend Getaway</h3>
                      <p className="text-sm text-slate-600 mt-2">
                        Fast-paced trip to Tokyo with limited planning time. Focuses on food, sightseeing, and time-optimized transit routes without decision fatigue.
                      </p>
                      <div className="mt-4 flex flex-wrap gap-1.5">
                        <span className="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-700">Solo</span>
                        <span className="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-700">Budget</span>
                        <span className="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-700">Tokyo</span>
                      </div>
                    </div>
                    <button
                      onClick={() => loadScenario(1)}
                      className="mt-6 w-full py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-semibold text-sm transition shadow-sm"
                    >
                      Load Scenario 1 Itinerary →
                    </button>
                  </div>

                  {/* Scenario 2 */}
                  <div className="glass-card p-6 rounded-2xl flex flex-col justify-between hover:shadow-lg transition border border-rose-100">
                    <div>
                      <div className="flex items-center justify-between mb-3">
                        <span className="px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-rose-100 text-rose-800">Scenario 2</span>
                        <span className="text-xs font-semibold text-slate-500">4-Day Vacation</span>
                      </div>
                      <h3 className="font-bold text-lg text-slate-900">Couple Personalized Vacation</h3>
                      <p className="text-sm text-slate-600 mt-2">
                        Romantic journey to Florence with relaxed pacing, scenic viewpoints, curated trattorias, boutique stay, and single-day regeneration.
                      </p>
                      <div className="mt-4 flex flex-wrap gap-1.5">
                        <span className="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-700">Couple (2x)</span>
                        <span className="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-700">Luxury</span>
                        <span className="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-700">Florence</span>
                      </div>
                    </div>
                    <button
                      onClick={() => loadScenario(2)}
                      className="mt-6 w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-semibold text-sm transition shadow-sm"
                    >
                      Load Scenario 2 Itinerary →
                    </button>
                  </div>

                  {/* Scenario 3 */}
                  <div className="glass-card p-6 rounded-2xl flex flex-col justify-between hover:shadow-lg transition border border-amber-100">
                    <div>
                      <div className="flex items-center justify-between mb-3">
                        <span className="px-2.5 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-amber-100 text-amber-800">Scenario 3</span>
                        <span className="text-xs font-semibold text-slate-500">4-Day Multi-Day</span>
                      </div>
                      <h3 className="font-bold text-lg text-slate-900">Small Group Coordinating Trip</h3>
                      <p className="text-sm text-slate-600 mt-2">
                        4 friends traveling to Barcelona with blended interests (adventure, tapas, nightlife) and shared budget cost-per-person tracking.
                      </p>
                      <div className="mt-4 flex flex-wrap gap-1.5">
                        <span className="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-700">Group (4x)</span>
                        <span className="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-700">Moderate</span>
                        <span className="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-700">Barcelona</span>
                      </div>
                    </div>
                    <button
                      onClick={() => loadScenario(3)}
                      className="mt-6 w-full py-2.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-semibold text-sm transition shadow-sm"
                    >
                      Load Scenario 3 Itinerary →
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TRIP BUILDER VIEW */}
            {view === "builder" && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                {/* Form Wizard */}
                <div className="lg:col-span-8 bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-200">
                  <div className="mb-6">
                    <h2 className="text-2xl font-extrabold text-slate-900 tracking-tight">Smart Trip Builder</h2>
                    <p className="text-sm text-slate-500 mt-1">Configure your destination, party style, and preferences for an AI-tailored plan.</p>
                  </div>

                  <form onSubmit={handleGenerate} className="space-y-6">
                    {/* Destination */}
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Destination City & Country</label>
                      <input
                        type="text"
                        value={formData.destination}
                        onChange={(e) => setFormData({ ...formData, destination: e.target.value })}
                        className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent text-sm font-medium"
                        placeholder="e.g. Tokyo, Japan or Florence, Italy"
                        required
                      />
                      <div className="flex gap-2 mt-2">
                        {["Tokyo, Japan", "Paris, France", "Florence, Italy", "Barcelona, Spain", "Banff, Canada"].map(city => (
                          <button
                            key={city}
                            type="button"
                            onClick={() => setFormData({ ...formData, destination: city })}
                            className="text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 hover:bg-teal-50 hover:text-teal-700 transition"
                          >
                            {city.split(",")[0]}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Dates */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Start Date</label>
                        <input
                          type="date"
                          value={formData.start_date}
                          onChange={(e) => setFormData({ ...formData, start_date: e.target.value })}
                          className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-teal-500"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">End Date</label>
                        <input
                          type="date"
                          value={formData.end_date}
                          onChange={(e) => setFormData({ ...formData, end_date: e.target.value })}
                          className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-teal-500"
                          required
                        />
                      </div>
                    </div>

                    {/* Traveler Style & Group Size */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Traveler Type</label>
                        <select
                          value={formData.traveler_type}
                          onChange={(e) => {
                            const val = e.target.value;
                            setFormData({
                              ...formData,
                              traveler_type: val,
                              group_size: val === "solo" ? 1 : (val === "couple" ? 2 : Math.max(3, formData.group_size))
                            });
                          }}
                          className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm font-medium focus:ring-2 focus:ring-teal-500"
                        >
                          <option value="solo">Solo Traveler (Scenario 1)</option>
                          <option value="couple">Couple Vacation (Scenario 2)</option>
                          <option value="group">Small Group / Friends (Scenario 3)</option>
                          <option value="family">Family Trip</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Party Size</label>
                        <input
                          type="number"
                          min="1"
                          max="30"
                          value={formData.group_size}
                          onChange={(e) => setFormData({ ...formData, group_size: parseInt(e.target.value) || 1 })}
                          className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm font-medium focus:ring-2 focus:ring-teal-500"
                        />
                      </div>
                    </div>

                    {/* Budget & Pacing */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Budget Level</label>
                        <div className="grid grid-cols-3 gap-2">
                          {["budget", "moderate", "luxury"].map(b => (
                            <button
                              key={b}
                              type="button"
                              onClick={() => setFormData({ ...formData, budget_level: b })}
                              className={`py-2 text-xs font-bold uppercase tracking-wider rounded-lg border transition ${formData.budget_level === b ? "bg-teal-600 text-white border-teal-600 shadow-sm" : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50"}`}
                            >
                              {b}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Pacing Style</label>
                        <div className="grid grid-cols-3 gap-2">
                          {["relaxed", "balanced", "fast-paced"].map(p => (
                            <button
                              key={p}
                              type="button"
                              onClick={() => setFormData({ ...formData, pacing: p })}
                              className={`py-2 text-xs font-bold uppercase tracking-wider rounded-lg border transition ${formData.pacing === p ? "bg-teal-600 text-white border-teal-600 shadow-sm" : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50"}`}
                            >
                              {p.split("-")[0]}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>

                    {/* Interests */}
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Travel Interests & Passions</label>
                      <div className="flex flex-wrap gap-2">
                        {availableInterests.map(interest => {
                          const active = formData.interests.includes(interest);
                          return (
                            <button
                              key={interest}
                              type="button"
                              onClick={() => handleInterestToggle(interest)}
                              className={`px-3 py-1.5 rounded-full text-xs font-semibold capitalize badge-chip transition ${active ? "bg-teal-600 text-white shadow-sm" : "bg-slate-100 text-slate-700 hover:bg-slate-200"}`}
                            >
                              {active ? "✓ " : "+ "}{interest}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    {/* Special Requests */}
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Special Requests or Constraints (Optional)</label>
                      <input
                        type="text"
                        value={formData.special_requests}
                        onChange={(e) => setFormData({ ...formData, special_requests: e.target.value })}
                        placeholder="e.g. Vegetarian food options, rooftop sunset spots, walking proximity..."
                        className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-teal-500"
                      />
                    </div>

                    {/* Submit Button */}
                    <button
                      type="submit"
                      className="w-full py-4 rounded-xl bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-700 hover:to-emerald-700 text-white font-bold text-base shadow-lg shadow-teal-600/25 transition duration-200 flex items-center justify-center space-x-2"
                    >
                      <span>Generate Personalized Itinerary</span>
                      <span>✨</span>
                    </button>
                  </form>
                </div>

                {/* Side Quick Launch & Scenarios */}
                <div className="lg:col-span-4 space-y-6">
                  <div className="glass-card rounded-2xl p-6 border border-slate-200">
                    <h3 className="font-bold text-slate-900 text-base mb-3">Quick Scenario Launcher</h3>
                    <p className="text-xs text-slate-500 mb-4">Click to immediately inspect and test the scenarios with pre-configured parameters:</p>
                    
                    <div className="space-y-3">
                      <button
                        onClick={() => loadScenario(1)}
                        className="w-full text-left p-3 rounded-xl border border-slate-200 hover:border-teal-500 hover:bg-teal-50/50 transition flex items-center justify-between group"
                      >
                        <div>
                          <div className="font-bold text-xs text-slate-900 group-hover:text-teal-700">Scenario 1: Solo Weekend</div>
                          <div className="text-xs text-slate-500">Tokyo • 2 Days • Budget</div>
                        </div>
                        <span className="text-xs text-teal-600 font-bold">Try →</span>
                      </button>

                      <button
                        onClick={() => loadScenario(2)}
                        className="w-full text-left p-3 rounded-xl border border-slate-200 hover:border-rose-500 hover:bg-rose-50/50 transition flex items-center justify-between group"
                      >
                        <div>
                          <div className="font-bold text-xs text-slate-900 group-hover:text-rose-700">Scenario 2: Romantic Couple</div>
                          <div className="text-xs text-slate-500">Florence • 4 Days • Luxury</div>
                        </div>
                        <span className="text-xs text-rose-600 font-bold">Try →</span>
                      </button>

                      <button
                        onClick={() => loadScenario(3)}
                        className="w-full text-left p-3 rounded-xl border border-slate-200 hover:border-amber-500 hover:bg-amber-50/50 transition flex items-center justify-between group"
                      >
                        <div>
                          <div className="font-bold text-xs text-slate-900 group-hover:text-amber-700">Scenario 3: Small Group</div>
                          <div className="text-xs text-slate-500">Barcelona • 4 Friends • Moderate</div>
                        </div>
                        <span className="text-xs text-amber-600 font-bold">Try →</span>
                      </button>
                    </div>
                  </div>

                  <div className="bg-slate-900 text-slate-200 rounded-2xl p-6 text-xs space-y-3">
                    <div className="font-bold text-white text-sm">System Diagnostics</div>
                    <div>• <strong>Models:</strong> 3 Transformer Encoders (Memory Cached)</div>
                    <div>• <strong>Engine:</strong> {health?.transformer_engine?.device || "CPU"}</div>
                    <div>• <strong>Storage:</strong> {health?.database?.storage_type || "Local SQLite"}</div>
                    <div>• <strong>Supabase RLS:</strong> Configured in schema.sql</div>
                  </div>
                </div>
              </div>
            )}

            {/* SAVED TRIPS VIEW */}
            {view === "saved" && (
              <div className="space-y-6">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-2xl font-extrabold text-slate-900">Saved Itineraries</h2>
                    <p className="text-sm text-slate-500">Quickly reload or review your generated itineraries.</p>
                  </div>
                  <button
                    onClick={() => setView("builder")}
                    className="px-4 py-2 bg-teal-600 text-white font-semibold text-sm rounded-xl hover:bg-teal-700 transition"
                  >
                    + Create New Trip
                  </button>
                </div>

                {savedTrips.length === 0 ? (
                  <div className="text-center py-12 bg-white rounded-2xl border border-slate-200 p-8">
                    <div className="text-4xl mb-3">🗺️</div>
                    <h3 className="font-bold text-slate-800">No saved trips yet</h3>
                    <p className="text-sm text-slate-500 mt-1">Generate your first itinerary to have it saved automatically.</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {savedTrips.map(trip => (
                      <div key={trip.id} className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between hover:shadow-md transition">
                        <div>
                          <div className="flex items-center justify-between text-xs text-slate-500 mb-2">
                            <span>{trip.start_date} → {trip.end_date}</span>
                            <span className="capitalize font-semibold text-teal-700 bg-teal-50 px-2 py-0.5 rounded">{trip.traveler_type}</span>
                          </div>
                          <h3 className="font-bold text-lg text-slate-900 mb-1">{trip.title}</h3>
                          <p className="text-sm font-semibold text-slate-600">{trip.destination}</p>
                          <div className="mt-4 flex items-center justify-between text-xs border-t border-slate-100 pt-3">
                            <span className="text-slate-500">Duration: <strong>{trip.total_days} Days</strong></span>
                            <span className="text-slate-900 font-bold">${trip.estimated_total_cost} total</span>
                          </div>
                        </div>
                        <div className="mt-6 flex space-x-2">
                          <button
                            onClick={() => loadSavedTrip(trip.id)}
                            className="flex-1 py-2 text-xs font-bold rounded-lg bg-teal-600 hover:bg-teal-700 text-white transition"
                          >
                            Open Itinerary
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* ITINERARY VIEW */}
            {view === "itinerary" && itinerary && (
              <div className="space-y-6">
                {/* Trip Banner Header */}
                <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                      <div className="flex flex-wrap items-center gap-2 mb-2">
                        <span className="px-3 py-1 rounded-full text-xs font-bold bg-teal-100 text-teal-800 uppercase tracking-wider">
                          {itinerary.traveler_type} Trip
                        </span>
                        <span className="px-3 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-700 capitalize">
                          {itinerary.budget_level} Budget
                        </span>
                        <span className="px-3 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-700 capitalize">
                          {itinerary.pacing} Pace
                        </span>
                        {itinerary.group_size > 1 && (
                          <span className="px-3 py-1 rounded-full text-xs font-bold bg-indigo-100 text-indigo-800">
                            Party of {itinerary.group_size}
                          </span>
                        )}
                      </div>
                      <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">{itinerary.title}</h2>
                      <p className="text-sm text-slate-500 mt-1 font-medium">
                        📍 {itinerary.destination} • {itinerary.start_date} to {itinerary.end_date} ({itinerary.total_days} Days)
                      </p>
                    </div>

                    {/* Cost Summary Box */}
                    <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 text-right min-w-[200px]">
                      <div className="text-xs font-bold uppercase text-slate-500">Estimated Total Cost</div>
                      <div className="text-2xl font-black text-slate-900">${itinerary.estimated_total_cost}</div>
                      {itinerary.group_size > 1 && (
                        <div className="text-xs font-semibold text-teal-700 mt-0.5">
                          ${itinerary.cost_per_person} per person
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="mt-4 p-4 rounded-xl bg-teal-50/70 border border-teal-100 text-sm text-teal-950 font-medium">
                    💡 <em>"{itinerary.highlight_quote}"</em>
                  </div>

                  {/* Action Toolbar */}
                  <div className="mt-6 flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 pt-4">
                    <div className="flex flex-wrap items-center gap-2">
                      <button
                        onClick={() => handleExport("markdown")}
                        className="px-3 py-1.5 text-xs font-bold rounded-lg border border-slate-300 hover:bg-slate-50 text-slate-700 transition"
                      >
                        Export Markdown
                      </button>
                      <button
                        onClick={() => handleExport("ics")}
                        className="px-3 py-1.5 text-xs font-bold rounded-lg border border-slate-300 hover:bg-slate-50 text-slate-700 transition"
                      >
                        Export Calendar (.ics)
                      </button>
                      <button
                        onClick={() => handleExport("json")}
                        className="px-3 py-1.5 text-xs font-bold rounded-lg border border-slate-300 hover:bg-slate-50 text-slate-700 transition"
                      >
                        JSON API
                      </button>
                    </div>

                    <button
                      onClick={() => setView("builder")}
                      className="px-4 py-1.5 text-xs font-bold text-teal-700 hover:text-teal-900 underline"
                    >
                      ← Build Another Trip
                    </button>
                  </div>
                </div>

                {/* Day Navigation Tabs */}
                <div className="flex items-center space-x-2 overflow-x-auto pb-2">
                  <button
                    onClick={() => setActiveDayTab("all")}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${activeDayTab === "all" ? "bg-slate-900 text-white" : "bg-white text-slate-700 border border-slate-200 hover:bg-slate-50"}`}
                  >
                    All Days ({itinerary.days.length})
                  </button>
                  {itinerary.days.map(d => (
                    <button
                      key={d.day_number}
                      onClick={() => setActiveDayTab(d.day_number.toString())}
                      className={`px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${activeDayTab === d.day_number.toString() ? "bg-teal-600 text-white" : "bg-white text-slate-700 border border-slate-200 hover:bg-slate-50"}`}
                    >
                      Day {d.day_number}
                    </button>
                  ))}
                </div>

                {/* Days List */}
                <div className="space-y-8">
                  {itinerary.days
                    .filter(d => activeDayTab === "all" || activeDayTab === d.day_number.toString())
                    .map(day => (
                      <div key={day.day_number} className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
                        {/* Day Title & Regeneration Trigger */}
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-100 gap-3">
                          <div>
                            <span className="text-xs font-black uppercase tracking-wider text-teal-700">Day {day.day_number} • {day.date}</span>
                            <h3 className="text-xl font-bold text-slate-900">{day.theme}</h3>
                          </div>
                          <div className="flex items-center space-x-3">
                            <span className="text-xs font-bold text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg">
                              Est. Day Cost: ${day.day_budget_estimate}
                            </span>
                            <button
                              onClick={() => {
                                setTargetRegenDay(day.day_number);
                                setRegenModalOpen(true);
                              }}
                              className="px-3 py-1.5 text-xs font-bold rounded-lg bg-teal-50 text-teal-700 hover:bg-teal-100 transition"
                            >
                              ↺ Regenerate Day
                            </button>
                          </div>
                        </div>

                        {/* Stay & Logistics Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                          {day.accommodation && (
                            <div className="p-4 rounded-2xl bg-amber-50/70 border border-amber-100 flex items-start space-x-3">
                              <span className="text-xl">🏨</span>
                              <div>
                                <div className="font-bold text-amber-900">Recommended Stay: {day.accommodation.name}</div>
                                <div className="text-amber-800 mt-0.5">{day.accommodation.type} in {day.accommodation.neighborhood} • ~${day.accommodation.estimated_nightly_cost}/night</div>
                              </div>
                            </div>
                          )}
                          {day.logistics_notes && (
                            <div className="p-4 rounded-2xl bg-sky-50/70 border border-sky-100 flex items-start space-x-3">
                              <span className="text-xl">🚇</span>
                              <div>
                                <div className="font-bold text-sky-900">Transit & Logistics Tip</div>
                                <div className="text-sky-800 mt-0.5">{day.logistics_notes}</div>
                              </div>
                            </div>
                          )}
                        </div>

                        {/* Activities Timeline */}
                        <div className="space-y-4 pt-2">
                          <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500">Day Schedule & Route Clustering</h4>
                          <div className="space-y-4">
                            {day.activities.map((act, actIndex) => (
                              <div key={act.id || actIndex} className="p-5 rounded-2xl border border-slate-200 hover:border-teal-400 transition bg-slate-50/50 flex flex-col md:flex-row md:items-center justify-between gap-4">
                                <div className="space-y-1.5 flex-1">
                                  <div className="flex items-center space-x-2">
                                    <span className="text-xs font-bold uppercase px-2 py-0.5 rounded bg-teal-100 text-teal-800">
                                      {act.time_slot} {act.start_time ? `• ${act.start_time}` : ""}
                                    </span>
                                    <span className="text-xs font-semibold text-slate-500 capitalize">
                                      {act.category} ({act.duration_minutes}m)
                                    </span>
                                  </div>
                                  <h5 className="font-bold text-base text-slate-900">{act.title}</h5>
                                  <p className="text-xs text-slate-600">{act.description}</p>
                                  <div className="flex flex-wrap items-center gap-2 text-xs pt-1">
                                    <span className="text-slate-500">📍 {act.location}</span>
                                    {act.booking_tip && (
                                      <span className="text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">
                                        Tip: {act.booking_tip}
                                      </span>
                                    )}
                                  </div>
                                </div>

                                <div className="flex md:flex-col items-center md:items-end justify-between md:justify-center border-t md:border-t-0 md:border-l border-slate-200 pt-3 md:pt-0 md:pl-4 space-y-2">
                                  <div className="font-bold text-slate-900 text-sm">
                                    ${act.estimated_cost}
                                  </div>
                                  <button
                                    onClick={() => handleReplaceActivity(day.day_number, act.id)}
                                    className="text-xs text-slate-500 hover:text-teal-600 font-semibold underline"
                                  >
                                    Swap Activity
                                  </button>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    ))}
                </div>
              </div>
            )}

            {/* REGENERATE MODAL */}
            {regenModalOpen && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                  <div className="flex items-center justify-between">
                    <h3 className="font-bold text-lg text-slate-900">Regenerate Day {targetRegenDay}</h3>
                    <button onClick={() => setRegenModalOpen(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                  </div>
                  <p className="text-xs text-slate-600">
                    Provide instructions or feedback to adjust the pacing, theme, or activity types for Day {targetRegenDay}:
                  </p>
                  <textarea
                    rows="3"
                    value={regenFeedback}
                    onChange={(e) => setRegenFeedback(e.target.value)}
                    className="w-full p-3 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-teal-500 focus:outline-none"
                    placeholder="e.g. More relaxed morning, add local coffee roaster, or focus on nature."
                  />
                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      onClick={() => setRegenModalOpen(false)}
                      className="px-4 py-2 text-xs font-semibold rounded-lg text-slate-600 hover:bg-slate-100"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={handleRegenerateDay}
                      className="px-4 py-2 text-xs font-bold rounded-lg bg-teal-600 hover:bg-teal-700 text-white shadow-sm"
                    >
                      Confirm & Regenerate
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-500">
            <p>Personalized Travel Itinerary Planner • Full-Stack Architecture (FastAPI + React + Supabase Integration)</p>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
